spring.application.name=cine

# ── Base de datos en memoria ─────────────────────────────────────────
# "mem" = vive en la memoria RAM
spring.datasource.url=jdbc:h2:mem:cine
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# se crea al arrancar y se borra al parar
spring.jpa.hibernate.ddl-auto=create-drop

# show-sql: escribe en el log cada consulta SQL.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
spring.web.error.include-binding-errors=never

# Obliga a que todo lo que usen las plantillas se cargue dentro de los servicios
spring.jpa.open-in-view=false
