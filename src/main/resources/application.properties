spring.application.name=cine
server.port=8080

# Guarda la sesion solo en cookie (evita ";jsessionid=..." en las URLs de las vistas)
server.servlet.session.tracking-modes=cookie

# ===== Conexion a MySQL =====
spring.datasource.url=jdbc:mysql://localhost:3306/cinecomfenalco_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=cine_app
spring.datasource.password=cine
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
# update -> crea/actualiza las tablas a partir de las clases @Entity (sin borrar datos)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.web.error.include-message=never
spring.web.error.include-stacktrace=never
spring.web.error.include-binding-errors=never

# Obliga a que todo lo que usen las plantillas se cargue dentro de los servicios
spring.jpa.open-in-view=false

