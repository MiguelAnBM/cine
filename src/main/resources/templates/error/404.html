<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: pagina('Página No Encontrada', 'error', ~{::#contenidoError})}">
<body>
  <div id="contenidoError" style="max-width: 600px; margin: 40px auto; text-align: center;">
    <div class="card card-pad-lg empty-state">
      <span class="icon icon-info" style="font-size: 56px; margin-bottom: 16px; color: var(--blue-600); opacity: 0.8;"></span>
      <h1 style="font-family: var(--font-display); font-size: 52px; line-height: 1; margin: 0 0 8px; color: var(--navy-800);">404</h1>
      <h2 style="font-size: 20px; margin: 0 0 8px;">Página no encontrada</h2>
      <p style="color: var(--muted); font-size: 14px; margin: 0 0 24px;">La página o recurso que estás intentando consultar no existe o ha sido movido.</p>
      <a class="btn btn-primary" th:href="@{/}">
        <span class="icon icon-dashboard"></span> Volver al panel de inicio
      </a>
    </div>
  </div>
</body>
</html>
